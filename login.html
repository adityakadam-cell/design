<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Log in — Nikey</title>
<meta name="robots" content="noindex">
<style>
  :root{ --ink:#151413; --muted:#6c6762; --line:#e4e4e4; --bg:#fff; --btn:#111; --err:#c0392b; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .hd{height:64px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line)}
  .hd a{display:inline-flex}
  .hd img{display:block;height:22px;width:auto}
  .wrap{min-height:calc(100vh - 64px);display:flex;align-items:flex-start;justify-content:center;padding:64px 20px}
  .card{width:100%;max-width:380px}
  h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
  .sub{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:16px}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 7px;color:var(--muted)}
  input{width:100%;height:48px;padding:0 14px;font-size:15px;color:var(--ink);
    background:#fff;border:1px solid #cfccc9;border-radius:0;outline:none;font-family:inherit}
  input:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  button{height:52px;margin-top:6px;border:0;border-radius:0;background:var(--btn);color:#fff;
    font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;font-family:inherit}
  button:hover{background:#000}
  .err{display:none;color:var(--err);font-size:13px;margin:2px 0 0}
  .err.show{display:block}
  .hint{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
  .hint code{background:#f3f2f1;padding:2px 6px;border-radius:3px;font-size:12px}
</style>
</head>
<body>
<header class="hd">
  <a href="./home.html" aria-label="Nikey home">
    <img src="https://nike-makknzjs.myshopify.com/cdn/shop/files/Logo_NIKE.svg?height=48&v=1789911219" alt="Nike">
  </a>
</header>
<main class="wrap">
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Welcome back. Sign in to continue.</p>
    <form id="login-form" novalidate>
      <div>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="err" id="err" role="alert">Incorrect username or password.</p>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Demo store login — use <code>admin</code> / <code>admin</code>.</p>
  </div>
</main>
<script>
  (function () {
    // Fixed demo credentials (client-side only — not real security).
    var USER = 'admin', PASS = 'admin';
    var params = new URLSearchParams(location.search);
    // Where to go after login: the page the user came from, else home.
    var from = params.get('from') || 'home.html';
    // only allow local same-site targets
    if (!/^[\w.-]+\.html([?#].*)?$/.test(from)) from = 'home.html';

    var form = document.getElementById('login-form');
    var err = document.getElementById('err');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      if (u === USER && p === PASS) {
        try { sessionStorage.setItem('nikey-signed-in', '1'); } catch (_) {}
        location.href = './' + from;
      } else {
        err.classList.add('show');
      }
    });
    document.getElementById('username').addEventListener('input', function () { err.classList.remove('show'); });
    document.getElementById('password').addEventListener('input', function () { err.classList.remove('show'); });
  })();
</script>
</body>
</html>
